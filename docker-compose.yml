# Local development database. Port 5433 avoids clashing with a system Postgres on 5432.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paperperps
      POSTGRES_PASSWORD: paperperps
      POSTGRES_DB: paperperps
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperperps"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
